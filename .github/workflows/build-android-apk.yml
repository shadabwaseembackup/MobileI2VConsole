
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "*.sln"
      - "**/*.csproj"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Build .NET MAUI Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore dependencies
        run: dotnet restore src/MobileI2VConsole/MobileI2VConsole.csproj

      - name: Publish Android APK
        run: |
          dotnet publish src/MobileI2VConsole/MobileI2VConsole.csproj \
            --configuration Release \
            --framework net10.0-android \
            -p:AndroidPackageFormat=apk \
            --output artifacts/apk

      - name: Verify APK output
        run: |
          find artifacts/apk -type f -name '*.apk'
          test -n "$(find artifacts/apk -type f -name '*.apk' -print -quit)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobileI2VConsole-Android-APK
          path: artifacts/apk/*.apk
          if-no-files-found: error
          retention-days: 14
          
